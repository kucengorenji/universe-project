<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skirmish</title>
  <meta name="theme-color" content="#efe6d2" />
  <meta name="description" content="A Valkyria Chronicles-style squad battle on a procedural battlefield." data-i18n-attr="content:skirmish.html.description"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@400;500;600&family=Courier+Prime:wght@400;700&family=Roboto+Serif:opsz,wdth,wght@8..144,50..150,400..800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="stage" aria-label="3D battlefield" data-i18n-attr="aria-label:skirmish.html.stage"></div>

  <div class="mapwrap"><canvas id="map" class="map" aria-label="Tactical map" data-i18n-attr="aria-label:skirmish.html.map"></canvas></div>
  <aside id="prep" class="prep" aria-label="Preparation" data-i18n-attr="aria-label:skirmish.html.prep"></aside>
  <div id="hud" class="hud"></div>

  <aside class="panel" aria-label="Look-dev" hidden>
    <h1 class="panel__title">Skirmish <span>look-dev</span></h1>
    <label class="row">Seed
      <input id="seed" type="number" min="1" step="1" inputmode="numeric" />
      <button id="reroll" type="button">Reroll</button>
    </label>
    <label class="row">Time
      <select id="time">
        <option value="day">Day</option>
        <option value="dusk">Dusk</option>
        <option value="night">Night</option>
      </select>
    </label>
    <label class="row">Pose
      <select id="pose">
        <option value="ready">Ready</option>
        <option value="aim">Aim</option>
        <option value="crouch">Crouch</option>
        <option value="crouch-aim">Crouch aim</option>
        <option value="walk">Walk</option>
        <option value="run">Run</option>
        <option value="crouch-walk">Crouch walk</option>
        <option value="down">Down</option>
        <option value="dead">Fallen</option>
      </select>
    </label>
    <label class="row row--check"><input id="canvasOn" type="checkbox" checked /> Canvas style</label>
    <div class="views" role="group" aria-label="Camera">
      <button type="button" data-view="lineup">Lineup</button>
      <button type="button" data-view="portrait">Portrait</button>
      <button type="button" data-view="tps">TPS</button>
      <button type="button" data-view="village">Village</button>
      <button type="button" data-view="enemy">Enemy line</button>
      <button type="button" data-view="overview">Overview</button>
    </div>
    <p id="stats" class="stats"></p>
  </aside>
  <p class="loading" aria-live="polite" data-i18n="skirmish.html.loading">Preparing the battlefield…</p>

  <script type="module" src="./src/skirmish/main.js"></script>
</body>
</html>

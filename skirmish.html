<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skirmish</title>
  <meta name="theme-color" content="#efe6d2" />
  <meta name="description" content="Pertempuran regu bergaya Valkyria Chronicles di medan perang prosedural." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="stage" aria-label="Medan perang 3D"></div>

  <aside class="panel" aria-label="Look-dev">
    <h1 class="panel__title">Skirmish <span>look-dev</span></h1>
    <label class="row">Seed
      <input id="seed" type="number" min="1" step="1" inputmode="numeric" />
      <button id="reroll" type="button">Acak</button>
    </label>
    <label class="row">Waktu
      <select id="time">
        <option value="day">Siang</option>
        <option value="dusk">Senja</option>
        <option value="night">Malam</option>
      </select>
    </label>
    <label class="row">Pose
      <select id="pose">
        <option value="ready">Siaga</option>
        <option value="aim">Bidik</option>
        <option value="crouch">Jongkok</option>
        <option value="crouch-aim">Jongkok bidik</option>
        <option value="walk">Jalan</option>
        <option value="run">Lari</option>
      </select>
    </label>
    <label class="row row--check"><input id="canvasOn" type="checkbox" checked /> Gaya canvas</label>
    <div class="views" role="group" aria-label="Kamera">
      <button type="button" data-view="lineup">Barisan</button>
      <button type="button" data-view="portrait">Potret</button>
      <button type="button" data-view="tps">TPS</button>
      <button type="button" data-view="village">Desa</button>
      <button type="button" data-view="enemy">Garis musuh</button>
      <button type="button" data-view="overview">Atas</button>
    </div>
    <p id="stats" class="stats"></p>
  </aside>
  <p class="loading" aria-live="polite">Menyiapkan medan perang…</p>

  <script type="module" src="./src/skirmish/main.js"></script>
</body>
</html>

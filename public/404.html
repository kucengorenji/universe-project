<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#d9d9d9" />
  <title>Page not found · Aethergate</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { --concrete: #d9d9d9; --iron: #1f1f1f; --yellow: #fbb833; --space: #070c19; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--space); color: #f5f3ec;
      font: 400 18px/1.35 'Barlow Condensed', 'Archivo Narrow', 'Roboto Condensed', ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 34rem; padding: 32px 16px; text-align: center; }
    h1 { margin: 0 0 8px; font-weight: 500; font-size: clamp(40px, 8vw, 72px); letter-spacing: -.01em; }
    p { margin: 0 0 6px; opacity: .85; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 24px; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 100px; text-decoration: none;
      background: var(--concrete); color: var(--iron); font-size: 20px; }
    a.primary { background: var(--yellow); }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page drifted out of orbit.</p>
    <p lang="id">Halaman ini tidak ditemukan.</p>
    <div class="row">
      <a class="primary" href="/play/">Enter the world</a>
      <a href="/">Home</a>
    </div>
  </main>
</body>
</html>

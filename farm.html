<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valley</title>
  <meta name="theme-color" content="#fbf3e2" />
  <meta name="description" content="Look-dev lembah pertanian: kit painted diorama, tanah yang dicat, rumput, dan empat waktu." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="stage" aria-label="Lembah 3D"></div>
  <aside class="panel" aria-label="Look-dev">
    <h1 class="panel__title">Valley <span>look-dev V5</span></h1>
    <div class="row" id="times" role="group" aria-label="Waktu"></div>
    <div class="row" id="seasons" role="group" aria-label="Musim"></div>
    <div class="row" role="group" aria-label="Kamera">
      <button type="button" id="rotL">⟲ Z</button>
      <button type="button" id="rotR">C ⟳</button>
      <button type="button" id="recenter">F Pusatkan</button>
    </div>
    <p class="hint">WASD jalan · Shift lari · 1–3 alat · Spasi pakai alat · E angkat/lempar/panen/goyang/elus/ngobrol · drag putar · drag kanan geser · scroll zoom · Z/C putar 90° · F pusatkan · T waktu · Y musim</p>
    <p id="stats" class="stats"></p>
  </aside>
  <div class="balloon" id="balloon" hidden><b id="balloonWho"></b><span id="balloonText"></span></div>
  <div class="hud" aria-live="polite">
    <div class="tools" id="tools" role="group" aria-label="Alat"></div>
    <p class="context" id="context"></p>
  </div>
  <p class="loading" aria-live="polite">Menyiapkan lembah…</p>
  <script type="module" src="./src/valley/main.js"></script>
</body>
</html>
